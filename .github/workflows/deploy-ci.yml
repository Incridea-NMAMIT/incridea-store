name: Application CI and staging candidates
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
concurrency:
  group: ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm}
      - run: npm ci
      - run: npm run build
      - run: npm test
  application:
    needs: validate
    uses: Incridea-NMAMIT/incridea-deploy/.github/workflows/application-ci.yml@main
    with:
      application_id: incridea-store
      dockerfile: Dockerfile
    secrets: inherit
